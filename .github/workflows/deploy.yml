name: CI/CD

# Test on every push/PR; build + deploy only on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Token permissions. id-token: write for AWS OIDC; contents: write lets
# semantic-release push tags, the changelog, and the version bump.
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  TERRAFORM_VERSION: '1.9.8'

jobs:
  # ---------------------------------------------------------------------------
  # 0. Commit lint — enforce Conventional Commits on PRs so semantic-release can
  #    derive the version. Runs only on pull requests.
  # ---------------------------------------------------------------------------
  commitlint:
    name: Lint commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  # ---------------------------------------------------------------------------
  # 1. Test — runs on every push and PR. Build/deploy depend on this passing.
  # ---------------------------------------------------------------------------
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start test database
        run: docker compose up -d postgres_test

      - name: Apply migrations to test database
        run: npm run db:migrate:deploy --workspace @determineat/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/determineat_test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/determineat_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/determineat_test

  # ---------------------------------------------------------------------------
  # 2. Release — semantic-release computes the next version from commit prefixes
  #    (fix:/feat:/BREAKING CHANGE), tags the repo, updates CHANGELOG.md +
  #    package.json, and creates a GitHub Release. Only on push to main.
  #    Outputs whether a release was published and the version, for the build.
  # ---------------------------------------------------------------------------
  release:
    name: Semantic release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          # Expose the resolved version (from package.json after the bump) so the
          # build job can tag the image. Empty if no release was published.
          VERSION="$(node -p "require('./package.json').version")"
          if git describe --tags --exact-match >/dev/null 2>&1; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 3. Build — build the Docker image and push to ECR, tagged with the semantic
  #    version (falls back to the git SHA when no release was published).
  #    Only runs on push to main, after test + release.
  # ---------------------------------------------------------------------------
  build:
    name: Build and push image
    needs: [test, release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the release commit (version bump / changelog)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Use the semantic version when a release was published, else the SHA.
          if [ -n "$RELEASE_VERSION" ]; then
            IMAGE_TAG="$RELEASE_VERSION"
          else
            IMAGE_TAG="${GITHUB_SHA::12}"
          fi
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build \
            --build-arg VITE_COGNITO_USER_POOL_ID="${{ vars.COGNITO_USER_POOL_ID }}" \
            --build-arg VITE_COGNITO_CLIENT_ID="${{ vars.COGNITO_CLIENT_ID }}" \
            --build-arg VITE_AWS_REGION="${{ vars.AWS_REGION }}" \
            -t "$IMAGE:$IMAGE_TAG" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
          echo "image_uri=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 4. Deploy — apply Terraform with the new image tag, then force a new ECS
  #    deployment. Database migrations run inside the container on startup
  #    (see Dockerfile CMD), so no DB access is needed from the runner.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_container_image: ${{ needs.build.outputs.image_uri }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
          TF_VAR_app_domain_url: ${{ vars.APP_DOMAIN_URL }}
        run: terraform apply -auto-approve

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION }}"

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --region "${{ vars.AWS_REGION }}"
